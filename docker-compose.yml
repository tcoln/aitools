services:
  aitools:
    build: .
    container_name: aitools
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://ollama:11434}
      - CHATABC_API_BASE=${CHATABC_API_BASE:-}
      - CHATABC_API_KEY=${CHATABC_API_KEY:-}
      - CHATABC_APP_ID=${CHATABC_APP_ID:-}
      - CHATABC_TR_CODE=${CHATABC_TR_CODE:-}
      - CHATABC_TR_VERSION=${CHATABC_TR_VERSION:-1}
      - CHATABC_MODEL=${CHATABC_MODEL:-chatabc-agent}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=sqlite+aiosqlite:///./data/app.db
    volumes:
      - aitools_data:/app/backend/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    profiles:
      - ollama

volumes:
  aitools_data:
  ollama_data: