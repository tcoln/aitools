<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能工具箱</title>
    <link rel="stylesheet" href="/css/style.css?v=21">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>
    <div id="app">
        <div id="login-page" class="page">
            <div class="login-container">
                <h1>AI工具箱</h1>
                <p class="subtitle">大模型对话 & 工具调用</p>
                <div class="login-tabs">
                    <button class="tab-btn active" data-tab="login">登录</button>
                    <button class="tab-btn" data-tab="register">注册</button>
                </div>
                <form id="login-form" class="auth-form active">
                    <input type="text" id="login-username" placeholder="用户名" required>
                    <input type="password" id="login-password" placeholder="密码" required>
                    <button type="submit" class="btn-primary">登录</button>
                </form>
                <form id="register-form" class="auth-form">
                    <input type="text" id="register-username" placeholder="用户名" required>
                    <input type="password" id="register-password" placeholder="密码" required>
                    <input type="text" id="register-display-name" placeholder="显示名称（可选）">
                    <input type="email" id="register-email" placeholder="邮箱（可选）">
                    <button type="submit" class="btn-primary">注册</button>
                </form>
                <div id="auth-error" class="error-message"></div>
            </div>
        </div>

        <div id="main-page" class="page" style="display:none">
            <nav class="sidebar">
                <div class="sidebar-header">
                    <h2 id="sidebar-toggle" class="sidebar-toggle" title="点击收缩侧边栏">☰ <span>AI工具箱</span></h2>
                    <div class="sidebar-collapsible">
                    <div class="model-selector">
                        <select id="model-select">
                            <option value="">加载中...</option>
                        </select>
                    </div>
                    <div class="user-info">
                        <span id="current-username"></span>
                        <span id="admin-badge" class="badge badge-admin" style="display:none">管理员</span>
                    </div>
                    </div>
                </div>
                <div class="sidebar-nav">
                    <button class="nav-btn active" data-page="chat">💬 <span>对话</span></button>
                    <button class="nav-btn" data-page="users" id="nav-users" style="display:none">👥 <span>用户管理</span></button>
                    <button class="nav-btn" data-page="tools" id="nav-tools" style="display:none">🛠️ <span>工具</span></button>
                </div>
                <div class="sidebar-footer">
                    <button class="btn-logout" id="btn-logout"><span class="logout-icon">⬅️</span><span>Exit</span></button>
                </div>
            </nav>

            <main class="content">
                <div id="page-chat" class="page-content active">
                    <div class="chat-container">
                        <div class="chat-sidebar">
                            <div class="chat-sidebar-header">
                                <h3>对话列表</h3>
                                <div class="chat-sidebar-header-actions">
                                    <button class="btn-icon" id="btn-toggle-conversations" title="收缩对话列表">◀</button>
                                    <button class="btn-new-chat" id="btn-new-chat">+ 新对话</button>
                                </div>
                            </div>
                            <div class="conversation-list" id="conversation-list"></div>
                        </div>
                        <div class="chat-main">
                            <button class="btn-expand-conversations" id="btn-expand-conversations" title="展开对话列表" style="display:none">▶</button>
                            <div class="chat-messages" id="chat-messages">
                                <div class="chat-welcome">
                                    <h2>欢迎使用智能工具箱</h2>
                                    <p>选择一个对话或创建新对话开始聊天</p>
                                </div>
                            </div>
                            <div class="chat-tools-grid" id="chat-tools-grid">
                                    <button class="tools-arrow tools-arrow-left" id="tools-arrow-left" title="上一页">◀</button>
                                    <div class="tools-grid-inner" id="tools-grid-inner"></div>
                                    <button class="tools-arrow tools-arrow-right" id="tools-arrow-right" title="下一页">▶</button>
                                </div>
                                <div class="chat-input-area">
                                <div class="chat-input-container">
                                    <textarea id="chat-input" placeholder="输入消息..." rows="3"></textarea>
                                    <div class="chat-input-actions">
                                        <button class="btn-attach" id="btn-attach" title="上传附件">📎</button>
                                        <input type="file" id="file-input" style="display:none" multiple>
                                        <button id="btn-send" class="btn-send">发送</button>
                                    </div>
                                </div>
                                <div class="attachments-preview" id="attachments-preview" style="display:none"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="page-users" class="page-content">
                    <div class="page-header">
                        <h2>用户管理</h2>
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>用户名</th>
                                    <th>显示名称</th>
                                    <th>邮箱</th>
                                    <th>角色</th>
                                    <th>状态</th>
                                    <th>创建时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="users-table-body"></tbody>
                        </table>
                    </div>
                    <div id="user-edit-modal" class="modal" style="display:none">
                        <div class="modal-content">
                            <h3 id="user-modal-title">编辑用户</h3>
                            <form id="user-edit-form">
                                <input type="hidden" id="edit-user-id">
                                <label>显示名称</label>
                                <input type="text" id="edit-display-name">
                                <label>邮箱</label>
                                <input type="email" id="edit-email">
                                <label>新密码（留空不修改）</label>
                                <input type="password" id="edit-password">
                                <label>
                                    <input type="checkbox" id="edit-is-admin"> 管理员
                                </label>
                                <label>
                                    <input type="checkbox" id="edit-is-active" checked> 启用
                                </label>
                                <div class="modal-actions">
                                    <button type="submit" class="btn-primary">保存</button>
                                    <button type="button" class="btn-secondary modal-close">取消</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div id="page-tools" class="page-content">
                    <div class="page-header">
                        <h2>工具管理</h2>
                    </div>

                    <div class="tools-section">
                        <div class="page-header">
                            <h3>📦 内置工具</h3>
                        </div>
                        <p class="section-desc">以下内置工具始终可用，无需额外配置</p>
                        <div class="mcp-service-list" id="builtin-tools-list">
                            <div class="mcp-card">
                                <div class="mcp-card-header">
                                    <span class="mcp-card-name">📅 get_current_date</span>
                                    <span class="mcp-card-badge builtin">内置</span>
                                </div>
                                <div class="mcp-card-desc">获取当前日期和时间，包括年、月、日、时、分、秒、星期</div>
                            </div>
                            <div class="mcp-card">
                                <div class="mcp-card-header">
                                    <span class="mcp-card-name">🌤️ get_weather</span>
                                    <span class="mcp-card-badge builtin">内置</span>
                                </div>
                                <div class="mcp-card-desc">查询指定城市的当前天气信息，包括温度、湿度、天气状况、风速等</div>
                            </div>
                        </div>
                    </div>

                    <div class="tools-section">
                        <div class="page-header">
                            <h3>🔌 工具服务</h3>
                            <button class="btn-primary btn-sm" id="btn-add-mcp">+ 添加工具</button>
                        </div>
                        <div class="mcp-service-list" id="mcp-service-list"></div>
                    </div>

                    <div id="mcp-edit-modal" class="modal" style="display:none">
                        <div class="modal-content">
                            <h3 id="mcp-modal-title">工具服务</h3>
                            <form id="mcp-edit-form">
                                <input type="hidden" id="edit-mcp-id">
                                <label>服务名称 *</label>
                                <input type="text" id="edit-mcp-name" required>
                                <label>描述</label>
                                <textarea id="edit-mcp-description" rows="2"></textarea>
                                <label>传输类型</label>
                                <select id="edit-mcp-transport">
                                    <option value="stdio">stdio</option>
                                    <option value="sse">sse</option>
                                    <option value="streamable-http">streamable-http</option>
                                </select>
                                <div id="mcp-stdio-fields">
                                    <label>命令</label>
                                    <input type="text" id="edit-mcp-command">
                                    <label>参数 (JSON数组)</label>
                                    <input type="text" id="edit-mcp-args" placeholder='["arg1", "arg2"]'>
                                    <label>环境变量 (JSON对象)</label>
                                    <input type="text" id="edit-mcp-env-vars" placeholder='{"KEY": "VALUE"}'>
                                </div>
                                <div id="mcp-sse-fields" style="display:none">
                                    <label>URL</label>
                                    <input type="text" id="edit-mcp-url">
                                    <label>Headers (JSON对象)</label>
                                    <input type="text" id="edit-mcp-headers" placeholder='{"Authorization": "Bearer xxx"}'>
                                </div>
                                <label>
                                    <input type="checkbox" id="edit-mcp-is-active" checked> 启用
                                </label>
                                <div class="modal-actions">
                                    <button type="submit" class="btn-primary">保存</button>
                                    <button type="button" class="btn-secondary modal-close">取消</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="/js/api.js?v=21"></script>
    <script src="/js/chat.js?v=103"></script>
    <script src="/js/users.js?v=21"></script>
    <script src="/js/mcp.js?v=21"></script>
    <script src="/js/app.js?v=21"></script>
</body>
</html>
